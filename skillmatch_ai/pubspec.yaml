name: resume_analyzer
description: AI Resume Matching & Career Tracker

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.9
  cloud_firestore: ^4.15.5
  google_sign_in: ^6.2.1
  shared_preferences: ^2.5.5

  # HTTP
  http: ^1.2.0
  http_parser: ^4.0.2
  file_picker: ^8.0.0+1

  # Keep Awake
  wakelock_plus: ^1.1.4

  image_picker: ^1.1.2
  image: ^4.2.0
  image_cropper: ^7.1.0

  # Charts
  fl_chart: ^0.68.0

  syncfusion_flutter_pdf: ^34.1.31

  # UI
  google_fonts: ^6.2.1
  animate_do: ^3.3.4
  dotted_border: ^2.1.0
  percent_indicator: ^4.2.3
  shimmer: ^3.0.0

  # Utils
  intl: ^0.19.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # App icon generation
  flutter_launcher_icons: ^0.14.1

  # Splash screen generation
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/skillmatch_icon_1024.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/skillmatch_splash.png"